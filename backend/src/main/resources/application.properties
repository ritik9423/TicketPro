# ===================================================================
# TicketPro Multi-Tenant SaaS Configuration
# ===================================================================

# Server Settings
server.port=${PORT:8081}
server.servlet.context-path=/
server.forward-headers-strategy=framework

# Application URLs (Configurable for local dev and cloud production)
ticketpro.frontend.url=${FRONTEND_URL:http://localhost:5173}
ticketpro.backend.url=${BACKEND_URL:http://localhost:8081}

# Database Settings (MySQL - Loaded securely from .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/TicketPro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Inbound Webhook Secret for External Integrations (SendGrid, Mailgun)
ticketpro.inbound.secret=${INBOUND_WEBHOOK_SECRET:}

# Tuned HikariCP High-Performance Connection Pool Settings
spring.datasource.hikari.pool-name=TicketProHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.keepalive-time=60000

# Suppress spurious clock leap / thread starvation warnings when OS sleeps or resumes
logging.level.com.zaxxer.hikari.pool.HikariPool=ERROR

# Spring Data Web Page Serialization Mode (Enables stable PagedModel DTO serialization)
spring.data.web.pageable.page-serialization-mode=via-dto

# Flyway Database Migration Configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File Upload Configuration (Max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Allowed Origins
ticketpro.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# TicketPro Gmail SMTP Configuration (Loaded securely from .env / environment)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
ticketpro.mail.from=${MAIL_FROM:TicketPro Support <support@ticketpro.io>}

# Super Admin Credentials (Loaded securely from .env / environment)
ticketpro.superadmin.email=${SUPERADMIN_EMAIL:superadmin@ticketpro.io}
ticketpro.superadmin.password=${SUPERADMIN_PASSWORD:}

# ===================================================================
# Mappls Outpost OAuth 2.0 / Anchor Configuration
# ===================================================================
outpost.base-url=${OUTPOST_BASE_URL:https://outpost.mappls.com}
outpost.token-url=${OUTPOST_TOKEN_URL:https://outpost.mappls.com/api/security/oauth/token}
outpost.check-token-url=${OUTPOST_CHECK_TOKEN_URL:https://outpost.mappls.com/api/security/oauth/check_token}
outpost.client-id=${OUTPOST_CLIENT_ID:}
outpost.client-secret=${OUTPOST_CLIENT_SECRET:}
outpost.check-token-api=${OUTPOST_CHECK_TOKEN_API:}
outpost.grant-type=${OUTPOST_GRANT_TYPE:client_credentials}
outpost.scope=${OUTPOST_SCOPE:}
outpost.connect-timeout-ms=10000
outpost.read-timeout-ms=15000

# ===================================================================
# CSAT Feedback Security Configuration
# ===================================================================
ticketpro.csat.secret=${CSAT_SECRET}
ticketpro.csat.expiration-days=${CSAT_EXPIRATION_DAYS:30}

# ===================================================================
# Rate Limiting Configuration
# ===================================================================
rate-limit.public-ticket.requests=${RATE_LIMIT_PUBLIC_TICKET_REQUESTS:10}
rate-limit.public-ticket.window-seconds=${RATE_LIMIT_PUBLIC_TICKET_WINDOW_SECONDS:60}
ticketpro.rate-limit.public-ticket.requests=${rate-limit.public-ticket.requests}
ticketpro.rate-limit.public-ticket.window-seconds=${rate-limit.public-ticket.window-seconds}



