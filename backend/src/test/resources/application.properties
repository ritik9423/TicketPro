# Import base main application properties
spring.config.import=optional:classpath:application.properties

# Test Overrides
CSAT_SECRET=Test_CSAT_Secret_Key_For_Unit_And_Integration_Tests_Only
ticketpro.csat.secret=Test_CSAT_Secret_Key_For_Unit_And_Integration_Tests_Only
ticketpro.csat.expiration-days=30
rate-limit.public-ticket.requests=10
rate-limit.public-ticket.window-seconds=60
ticketpro.rate-limit.public-ticket.requests=10
ticketpro.rate-limit.public-ticket.window-seconds=60

# Database Settings fallback from main
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/TicketPro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
