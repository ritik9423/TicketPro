    <script>
      // Global Drag and Drop protection so browser NEVER opens dropped files as full page navigation
      window.addEventListener('dragover', function(e) {
        e.preventDefault();
      }, false);
      window.addEventListener('drop', function(e) {
        // If dropped outside of an input[type="file"], prevent browser page throw
        if (e.target && e.target.tagName !== 'INPUT') {
          e.preventDefault();
        }
      }, false);
    </script>
